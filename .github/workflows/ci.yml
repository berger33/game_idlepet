name: CI

on:
  push:
    branches: [main, "arena/*"]
  pull_request:

jobs:
  static:
    name: Lint + testes de dados/economia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit pillow
      - name: Lint GDScript (projeto inteiro)
        run: gdlint $(git ls-files '*.gd')
      - name: Testes de dados, economia e contratos de UI
        run: python -m unittest discover -s tests -v
      - name: Validação estrutural do projeto
        run: python tools/validate_project.py
      - name: Verificação funcional das animações dos 50 pets (500 PNGs)
        run: python tools/verify_pet_animations.py

  runtime:
    name: Godot headless (import + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.7.2 headless
        run: |
          curl -fL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import de assets (valida preload/paths)
        run: ./godot --headless --import
      - name: Smoke test — 120 frames da cena principal
        run: ./godot --headless --quit-after 120
      - name: Análise estática de todos os scripts (nível editor, 4.7.2)
        run: |
          status=0
          while IFS= read -r script; do
            output=$(./godot --headless --check-only --script "res://$script" 2>&1)
            if [ $? -ne 0 ]; then
              echo "::error file=$script::análise estática falhou (Godot 4.7.2)"
              echo "$output"
              status=1
            fi
          done < <(git ls-files '*.gd')
          # Autoteste do detector: um script com colisão var/func DEVE falhar.
          printf 'extends Node\nvar probe: int = 1\nfunc probe() -> int:\n\treturn 1\n' > probe_collision_selftest.gd
          if ./godot --headless --check-only --script res://probe_collision_selftest.gd > /dev/null 2>&1; then
            echo "::error::detector de análise estática não registrou a colisão de teste"
            status=1
          else
            echo "detector validado: script de teste com colisão falhou como esperado"
          fi
          rm -f probe_collision_selftest.gd
          exit $status
