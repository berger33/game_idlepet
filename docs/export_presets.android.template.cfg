; Template Android — copie este preset para export_presets.cfg somente depois
; de instalar Android SDK/JDK e configurar Editor Settings > Export > Android.
[preset.0]
name="Android"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,tools/*,tests/*"
export_path="exports/petshop-tycoon.aab"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.seunome.petshoptycoon"
package/name="PetShop Tycoon"
package/signed=true
version/code=1
version/name="0.1.0"
permissions/internet=true
permissions/vibrate=true
