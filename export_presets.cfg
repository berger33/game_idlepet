; Preset ativo sem dependência do Android SDK, para abrir/testar sem erros.
[preset.0]
name="Web Preview"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,tools/*,tests/*"
export_path="exports/web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
; Sem threads: roda em hospedagem estática (GitHub Pages/itch) sem cabeçalhos
; COOP/COEP — é o canal viral de "jogue agora" do plano de retenção.
variant/thread_support=false
; Sem threads: roda em hospedagem estática (GitHub Pages/itch) sem cabeçalhos
; COOP/COEP — é o canal viral de "jogue agora" do plano de retenção.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
